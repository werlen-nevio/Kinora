# Kinora: Selbsthosting.
#   docker compose up -d --build                  Anwendung und Datenbank
#   docker compose --profile proxy up -d --build  zusätzlich Nginx mit HTTPS
#   docker compose up -d db                       nur die Datenbank für die Entwicklung

name: kinora

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kinora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Setze POSTGRES_PASSWORD in der .env}
      POSTGRES_DB: kinora
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # Nur lokal erreichbar. Der Standardport passt zur DATABASE_URL in .env.example.
      - "127.0.0.1:${KINORA_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kinora -d kinora"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgresql://kinora:${POSTGRES_PASSWORD}@db:5432/kinora
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://kinora:${POSTGRES_PASSWORD}@db:5432/kinora
      TMDB_READ_ACCESS_TOKEN: ${TMDB_READ_ACCESS_TOKEN:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Setze BETTER_AUTH_SECRET in der .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Setze BETTER_AUTH_URL in der .env}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Kinora <no-reply@localhost>}
      SMTP_ALLOW_PLAINTEXT: ${SMTP_ALLOW_PLAINTEXT:-false}
      LOG_RESET_LINKS: ${LOG_RESET_LINKS:-false}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
    ports:
      # Immer nur lokal. Fürs Netzwerk gibt es das Profil «proxy»: Ohne Nginx könnte jeder
      # den Header X-Forwarded-For selbst setzen und so das Rate Limiting umgehen.
      - "127.0.0.1:${KINORA_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  nginx:
    image: nginx:1.29-alpine
    profiles: ["proxy"]
    restart: unless-stopped
    environment:
      KINORA_DOMAIN: ${KINORA_DOMAIN:-localhost}
    volumes:
      # Als default.conf: ersetzt die Willkommensseite des Images, die sonst fremde Hostnamen beantwortet.
      - ./docker/nginx/kinora.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${KINORA_CERT_DIR:-./docker/certs}:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app

volumes:
  postgres-data:
